services:
  postgres:
    image: postgres:17
    container_name: postgres_yaya
    environment:
      POSTGRES_DB: LineBotScript
      POSTGRES_USER: yaya
      POSTGRES_PASSWORD: zxcv4567
    ports:
      - "5432:5432"
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - ./frontend/templates:/app/templates
      - ./frontend/static:/app/static
    networks:
      - my_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app  # 將本地 frontend 目錄掛載到容器中
    command: npm start
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

volumes:
  postgres_data: {}  # 應該是一個空字典映射，確保格式正確
