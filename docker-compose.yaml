services:
  nginx_proxy:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./html:/var/www/html
      - ./ssl:/etc/letsencrypt
      - ./ssl-dhparams:/etc/ssl/certs/dhparam.pem
    depends_on:
      - backend
      - frontend
    networks:
      - my_network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./ssl-dhparams:/etc/ssl/certs
      - ./html:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot certonly --webroot -w /var/www/html -d yaya200.live -d www.yaya200.live --email yaya650042@gmail.com --agree-tos --no-eff-email; sleep 12h & wait $${!}; done;'"
    networks:
      - my_network

  postgres:
    image: postgres:17
    container_name: postgres_yaya
    environment:
      POSTGRES_DB: LineBotScript
      POSTGRES_USER: yaya
      POSTGRES_PASSWORD: zxcv4567
    ports:
      - "5432:5432"
    networks:
      - my_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - ./frontend/templates:/app/templates
      - ./frontend/static:/app/static
    networks:
      - my_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app  
    command: npm start
    networks:
      - my_network

networks:
  my_network:
    driver: bridge

volumes:
  postgres_data: {} 
  certs: {}  # 如果需要，可以在这里定义 certs 卷
